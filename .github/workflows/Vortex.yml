name: Vortex Tests
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-vortex-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Vortex Tests (Linux relassert)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      GEN: ninja
      ENABLE_VORTEX: 1
      BUILD_EXTENSION_TEST_DEPS: full
      DUCKLAKE_CI: 1

    steps:
      - name: Install required Ubuntu packages
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build ccache clang libclang-dev pkg-config python3 mold

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout $(cat ../.github/duckdb-version)

      - name: Read Rust toolchain version
        id: rust-toolchain
        run: |
          channel=$(python3 -c "import tomllib; print(tomllib.load(open('vortex/rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vortex/vortex-extension -> ../../build/relassert/cargo/build
          key: vortex-relassert

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}
          max-size: 5G
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

      - name: Build DuckLake with Vortex (relassert)
        run: |
          ENABLE_VORTEX=1 GEN=ninja make relassert

      - name: Run Vortex, format, and regression tests
        run: |
          ./build/relassert/test/unittest "test/sql/vortex/*"
          ./build/relassert/test/unittest "test/sql/format/*"
          ./build/relassert/test/unittest "test/sql/comments/column_unknown_tag.test"
          ./build/relassert/test/unittest "test/sql/general/unknown_data_file_format.test"

      - name: Start SeaweedFS (S3)
        run: |
          ./scripts/start-docker.sh
          (cd scripts && docker compose run --rm s3-init 'aws s3 ls s3://test-bucket >/dev/null 2>&1 || aws s3 mb s3://test-bucket')

      - name: Run S3 Vortex tests
        env:
          S3_TEST_SERVER_AVAILABLE: 1
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: password
          AWS_ENDPOINT: http://127.0.0.1:9000
          AWS_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_REGION: us-east-1
          AWS_ALLOW_HTTP: "true"
          AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
        run: |
          ./build/relassert/test/unittest --test-config test/configs/seaweedfs.json "test/sql/vortex/vortex_write_s3.test"
